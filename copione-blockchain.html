<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copione docente — Blockchain</title>
<style>
  :root{--bg:#0d1220;--card:#182238;--card2:#1e2b45;--ink:#e8eef7;--dim:#a3b3cc;--faint:#647392;--blue:#60a5fa;--gold:#f5c451;--border:#26344f;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%;}
  #top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:5;}
  #top .num{background:var(--blue);color:#06283e;font-weight:800;border-radius:8px;padding:4px 10px;font-size:.95rem;}
  #top .lab{font-size:1rem;font-weight:600;flex:1;line-height:1.2;}
  #top .clk{font-size:.9rem;color:var(--gold);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;}
  #wrap{padding:18px 18px 90px;max-width:760px;margin:0 auto;}
  .proj{background:var(--card2);border-radius:12px;padding:12px 15px;font-size:.9rem;color:var(--dim);margin-bottom:16px;line-height:1.5;}
  .proj b{color:var(--ink);}
  .cue{background:var(--card);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 17px;margin-bottom:14px;}
  .cue .t{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:7px;}
  .cue .b{font-size:1.08rem;line-height:1.6;color:var(--ink);}
  .cue .b b{color:var(--blue);}
  #ctrl{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;padding:12px 16px;}
  #ctrl button{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:14px;font-size:1rem;font-weight:600;cursor:pointer;}
  #ctrl button:active{background:var(--blue);color:#06283e;}
  .hint{font-size:.8rem;color:var(--faint);text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div id="top"><span class="num" id="num">1</span><span class="lab" id="lab"></span><span class="clk" id="clk">⏱ 00:00</span></div>
<div id="wrap"><div class="proj" id="proj"></div><div id="cues"></div><p class="hint">Scorri con swipe ← → o frecce. Questa pagina è solo per te (iPad): il proiettore mostra la dashboard.</p></div>
<div id="ctrl"><button id="prev">← Indietro</button><button id="next">Avanti →</button></div>
<script>
const SC=[
 {n:"0",lab:"Titolo",proj:"Slide titolo: «La blockchain, spiegata sul serio».",cues:[["Apri così","«Oggi la blockchain smette di essere una parola magica. Niente slide morte: si vota, si gioca, si costruisce una catena a mano.»"],["Il patto","Prometti il filo: <b>registro → catena → consenso → usi → carbonio</b>. E la frase finale: 'una macchina per la fiducia'."]]},
 {n:"1",lab:"Apertura + Mentimeter",proj:"Word cloud Mentimeter proiettata.",cues:[["Lancia il voto","Dai codice/QR del Mentimeter. 60-90'' di voto, non commentare subito."],["Poi ribalta","Escono 'bitcoin/soldi/truffe'. «Tenete questa nuvola, a fine lezione la rifacciamo»: è il pre/post."]]},
 {n:"2",lab:"Chi tiene il registro?",proj:"Card: registro, custode, doppia spesa.",cues:[["Il gancio","«Chi tiene il registro dei vostri soldi? E se non vi fidaste di lui?»"],["Doppia spesa","«Un file si copia — perché non posso spendere due volte lo stesso euro digitale?» È la domanda madre."]]},
 {n:"3",lab:"Il quaderno condiviso",proj:"Confronto: una copia (banca) vs mille copie (blockchain).",cues:[["Metafora chiave","Insisti sul quaderno. Da qui discende tutto: nessun capo, tante copie che si controllano."]]},
 {n:"4",lab:"DEMO · Hash",proj:"Riquadro: scrivi un testo → esce l'impronta.",cues:[["Falla toccare","Cambia UNA lettera e guarda l'impronta stravolgersi. Effetto 'oh'."],["Onestà","Di' che è semplificata: le vere usano SHA-256. Il concetto è identico."]]},
 {n:"5",lab:"DEMO · Catena + manomissione",proj:"4 blocchi collegati dall'hash.",cues:[["Momento clou","Fai modificare il campo Dati di un blocco: i successivi diventano rossi. «Avete provato a riscrivere la storia — e tutti se ne sono accorti.»"],["Chiudi","Ri-sigilla: per barare davvero dovresti rifare TUTTE le copie insieme. Impossibile."]]},
 {n:"6",lab:"DEMO · Consenso",proj:"Rete di 5 nodi + doppia spesa.",cues:[["Guida i passi","Clicca 'Trasmetti' passo per passo. La doppia spesa viene bocciata: prima valida vince."],["Energia","PoS ha tagliato ~99,95% dei consumi di Ethereum (2022). Sfata 'inquina come una nazione'."]]},
 {n:"7",lab:"Chiavi e wallet",proj:"Chiave pubblica vs privata.",cues:[["Semplifica","Cassetta delle lettere (pubblica) vs chiave (privata). «Not your keys, not your coins.»"]]},
 {n:"8",lab:"Token, smart contract + quiz",proj:"3 card + Mentimeter quiz.",cues:[["Due parole","Token = gettone unico. Smart contract = distributore automatico di regole."],["Pubblica/privata","Per le filiere si usa quasi sempre la PERMESSA. Poi lancia il quiz Mentimeter."]]},
 {n:"9",lab:"Panoramica casi d'uso",proj:"6 card: pagamenti, RWA, NFT, identità, filiere, PA.",cues:[["Ritmo","Apri 3-4 card, non tutte. Il filo: non 'soldi', ma 'fiducia distribuita'."]]},
 {n:"10",lab:"MiCA",proj:"3 numeri + 3 card.",cues:[["Contesto","MiCA in vigore dal 2026: fine del Far West. Solo ~1 operatore su 5 autorizzato."]]},
 {n:"11",lab:"Focus agroalimentare",proj:"Frode EVOO, QR, casi italiani + demo pOsti.",cues:[["Vicino a loro","Olio e vino, frode fino all'80% EVOO. Il QR che 'racconta la bottiglia'."],["Demo pOsti (la nostra piattaforma)","Apri posti.world/collection, clicca il @ di un prodotto (es. olio EVO): mostra il percorso on-chain reale. Dietro c'è traceability-platform.posti.world."],["Seminala","«La blockchain certifica, ma i dati li fanno sensori e persone.» Torna nell'oracolo."]]},
 {n:"12",lab:"DEMO · Serve davvero?",proj:"Albero decisionale interattivo.",cues:[["Falla usare","Fai rispondere la classe. Verdetto frequente e onesto: 'ti basta un database'."],["Antidoto","Nomina il blockchain-washing: la parola messa lì per vendere."]]},
 {n:"13",lab:"Crediti on-chain",proj:"Problema, soluzione, cerchio che si chiude.",cues:[["Il ponte","Collega alla lezione precedente: 'sensore → AI → blockchain'. La blockchain è l'ultimo anello: certifica e paga."]]},
 {n:"14",lab:"Stato reale 2026",proj:"Numeri veri + Toucan×Verra.",cues:[["Onestà sui numeri","45 Mt on-chain nel 2025 ma <8% del mercato. Promettente, non risolutivo. La pace Toucan-Verra (2025) dà legittimità."]]},
 {n:"15",lab:"Il problema dell'oracolo",proj:"«Integrità del registrato, non della verità».",cues:[["IL concetto","Se ricordano una cosa sola è questa. Garbage in → garbage forever."],["Chiudi la parte","«È l'agronomia che sequestra, non la catena di blocchi.» Poi si gioca."]]},
 {n:"17",lab:"🎲 Simulazione · Filiera olio + carbonio",proj:"Timer 45' + 4 ruoli. Setup ibrido: Produttore e Verificatore in aula, Trasformatore e Acquirente nei breakout.",cues:[["Setup ibrido","Produttore + Verificatore in aula (carta); Trasformatore + Acquirente nei 2 breakout (scheda nel chat). Un portavoce per gruppo."],["Round 3 · oracolo","Passa in segreto al Produttore il bigliettino: olive da fuori regione dichiarate locali. Fai registrare on-chain, poi rivela: la blockchain ha reso immutabile la bugia."],["Round 4 · carbonio","«Lo stesso oliveto cattura CO₂: lo tokenizziamo?» Il carbonio del suolo è invisibile → serve dMRV (sensori+satellite+AI) + verificatore. Ponte con l'altra lezione: sensore misura, AI stima, blockchain certifica e paga."],["Round 5 · firma","Conti a voce: premio olio + ricavi carbonio. Se non firmano tutti, salta tutto."]]},
 {n:"18",lab:"Debrief + feedback",proj:"Domande guida + Mentimeter feedback.",cues:[["Esci dai ruoli","Ogni gruppo racconta la decisione/scoperta più difficile. Poi le 4 domande guida."],["Chiudi + feedback","Frase finale sul carbonio. Poi proietta il QR del Mentimeter di feedback e commenta in diretta."]]},
];
let i=0;
function render(){
  const s=SC[i];
  document.getElementById("num").textContent=s.n;
  document.getElementById("lab").textContent=s.lab;
  document.getElementById("proj").innerHTML="📽 <b>Sul proiettore:</b> "+s.proj;
  document.getElementById("cues").innerHTML=s.cues.map(c=>`<div class="cue"><div class="t">${c[0]}</div><div class="b">${c[1]}</div></div>`).join("");
  window.scrollTo(0,0);
}
document.getElementById("next").onclick=()=>{if(i<SC.length-1){i++;render();}};
document.getElementById("prev").onclick=()=>{if(i>0){i--;render();}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click();});
let x0=null;
document.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;});
document.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(dx<-50)document.getElementById("next").click();if(dx>50)document.getElementById("prev").click();x0=null;});
let cs=0,con=false,ci=null;
const clk=document.getElementById("clk");
clk.onclick=()=>{con=!con;if(con){ci=setInterval(()=>{cs++;const m=Math.floor(cs/60),r=cs%60;clk.textContent="⏱ "+(m<10?"0":"")+m+":"+(r<10?"0":"")+r;},1000);}else clearInterval(ci);};
render();
</script>
</body>
</html>
